<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>今晚吃什么</title>
<meta name="theme-color" content="#E2552F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
/* 设计：温暖家常厨房，番茄红 accent + 分类语义色 */
:root {
  --bg: #FDFAF4;
  --surface: #FFFFFF;
  --surface-2: #F6EFE3;
  --fg: #332A24;
  --muted: #97897C;
  --line: #EAE0D0;
  --accent: #E2552F;
  --accent-strong: #C7431F;
  --on-accent: #FFFFFF;
  --meat: #C7502E;
  --veg: #3F8E5B;
  --soup: #2F8A85;
  --staple: #B8860B;
  --meat-bg: rgba(199,80,46,.12);
  --veg-bg: rgba(63,142,91,.12);
  --soup-bg: rgba(47,138,133,.12);
  --staple-bg: rgba(184,134,11,.12);
  --shadow: 0 1px 2px rgba(51,42,36,.05), 0 8px 24px rgba(51,42,36,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1A17;
    --surface: #27221E;
    --surface-2: #2F2923;
    --fg: #F0E7DC;
    --muted: #A99A8B;
    --line: #3A332B;
    --accent: #FF7A4D;
    --accent-strong: #FF8F6B;
    --on-accent: #2B1408;
    --meat: #E86B4A;
    --veg: #5CB876;
    --soup: #4FB3AD;
    --staple: #D9A93A;
    --meat-bg: rgba(232,107,74,.16);
    --veg-bg: rgba(92,184,118,.16);
    --soup-bg: rgba(79,179,173,.16);
    --staple-bg: rgba(217,169,58,.16);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1A17;
  --surface: #27221E;
  --surface-2: #2F2923;
  --fg: #F0E7DC;
  --muted: #A99A8B;
  --line: #3A332B;
  --accent: #FF7A4D;
  --accent-strong: #FF8F6B;
  --on-accent: #2B1408;
  --meat: #E86B4A;
  --veg: #5CB876;
  --soup: #4FB3AD;
  --staple: #D9A93A;
  --meat-bg: rgba(232,107,74,.16);
  --veg-bg: rgba(92,184,118,.16);
  --soup-bg: rgba(79,179,173,.16);
  --staple-bg: rgba(217,169,58,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 520px; margin: 0 auto; }

/* 顶部 */
.top { padding: 8px 2px 20px; }
.date { font-size: 13px; color: var(--muted); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
h1 { font-size: 30px; font-weight: 800; margin: 4px 0 6px; letter-spacing: -.01em; text-wrap: balance; }
.sub { font-size: 14px; color: var(--muted); margin: 0; }

/* 菜单卡片 */
.menu { display: grid; gap: 10px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.card-head {
  width: 100%; display: flex; align-items: center; gap: 12px;
  padding: 16px; background: none; border: none; cursor: pointer;
  font: inherit; color: var(--fg); text-align: left;
}
.card-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.badge {
  flex: 0 0 auto; font-size: 12.5px; font-weight: 700;
  padding: 4px 10px; border-radius: 999px; white-space: nowrap;
}
.cat-soup .badge { background: var(--soup-bg); color: var(--soup); }
.cat-meat .badge { background: var(--meat-bg); color: var(--meat); }
.cat-veg  .badge { background: var(--veg-bg);  color: var(--veg); }
.cat-staple .badge { background: var(--staple-bg); color: var(--staple); }
.dish-name { flex: 1 1 auto; font-size: 17px; font-weight: 700; min-width: 0; }
.chev { flex: 0 0 auto; color: var(--muted); font-size: 14px; transition: transform .2s; }
.card.open .chev { transform: rotate(180deg); }

.card-body { padding: 0 16px 16px; border-top: 1px solid var(--line); }
.card-body section { padding-top: 14px; }
.sec-label { font-size: 12.5px; font-weight: 800; color: var(--muted); letter-spacing: .04em; margin: 0 0 8px; }
.ing-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.ing-list li { font-size: 14px; background: var(--surface-2); border-radius: 8px; padding: 4px 10px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: s; }
.steps li { position: relative; padding-left: 30px; font-size: 14.5px; }
.steps li::before {
  counter-increment: s; content: counter(s);
  position: absolute; left: 0; top: 2px; width: 20px; height: 20px;
  background: var(--surface-2); color: var(--muted); border-radius: 50%;
  font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}

/* 换一批 */
.reroll {
  display: block; width: 100%; margin: 18px 0 6px; padding: 13px;
  background: var(--accent); color: var(--on-accent);
  border: none; border-radius: 14px; font: inherit; font-size: 16px; font-weight: 700;
  cursor: pointer; box-shadow: var(--shadow);
}
.reroll:active { transform: scale(.99); }
.reroll:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }

/* 买菜清单 */
.shopping { margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
.shopping h2 { margin: 0 0 4px; font-size: 18px; }
.shopping .hint { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
.shop-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.shop-list li { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.shop-list li:last-child { border-bottom: none; }
.shop-list input { width: 20px; height: 20px; flex: 0 0 auto; accent-color: var(--accent); cursor: pointer; }
.shop-list label { font-size: 15px; cursor: pointer; flex: 1 1 auto; }
.shop-list input:checked + label { text-decoration: line-through; color: var(--muted); }
.progress { font-size: 13px; color: var(--muted); margin-top: 12px; font-variant-numeric: tabular-nums; }

/* 首页主入口 */
.hero-card { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%); color: var(--on-accent); border-radius: 20px; padding: 22px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
.hero-art { font-size: 38px; letter-spacing: 6px; margin-bottom: 10px; }
.hero-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
.hero-desc { font-size: 14px; opacity: .92; margin-bottom: 16px; }
.hero-btn { display: block; width: 100%; padding: 13px; font-size: 16px; font-weight: 700; background: var(--on-accent); color: var(--accent-strong); border: none; border-radius: 12px; cursor: pointer; }
.hero-btn:active { transform: scale(.99); }

/* 清冰箱区块 */
.fridge-block { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
.fridge-block h2 { margin: 0 0 2px; font-size: 18px; }

/* 辅助入口 */
.quick-entries { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 2px 0 18px; }
.quick-entry { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.quick-entry:active { transform: scale(.98); }
.qe-emoji { font-size: 22px; }
.qe-text { font-size: 13px; font-weight: 600; color: var(--fg); }
.back-btn { display: inline-block; margin: 0 0 10px; padding: 6px 12px; font-size: 13px; font-weight: 600; background: var(--surface-2); color: var(--muted); border: none; border-radius: 9px; cursor: pointer; }
.view { display: none; }
.view.active { display: block; }

/* 一人餐 */
.solo-entries { display: grid; gap: 10px; }
.solo-entry { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; cursor: pointer; box-shadow: var(--shadow); }
.solo-entry:active { transform: scale(.99); }
.solo-emoji { font-size: 26px; }
.solo-title { font-size: 17px; font-weight: 700; margin: 6px 0 2px; }
.solo-desc { font-size: 13.5px; color: var(--muted); }
.solo-card { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
.solo-card .tagline { font-size: 15px; font-weight: 700; color: var(--accent); margin: 0 0 12px; }
.solo-card .idea { font-size: 19px; font-weight: 800; margin: 0 0 6px; }
.solo-card .idea-desc { font-size: 15px; line-height: 1.7; }
.again { margin-top: 14px; padding: 9px 16px; font-size: 14px; font-weight: 600; background: var(--surface-2); color: var(--fg); border: none; border-radius: 10px; cursor: pointer; }

/* 清冰箱 */
.fridge-box { display: flex; gap: 8px; margin-bottom: 14px; }
.fridge-box input { flex: 1; padding: 12px 14px; font-size: 15px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); min-width: 0; }
.fridge-box input:focus { outline: 2px solid var(--accent); }
.fridge-box button { padding: 12px 16px; font-size: 15px; font-weight: 700; background: var(--accent); color: var(--on-accent); border: none; border-radius: 12px; cursor: pointer; white-space: nowrap; }
.match-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow); }
.match-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.match-name { font-size: 16px; font-weight: 700; }
.match-pct { font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.match-lines { font-size: 13.5px; margin-top: 6px; line-height: 1.7; }
.have { color: var(--veg); }
.lack { color: var(--meat); }
.fridge-empty { font-size: 14px; color: var(--muted); text-align: center; padding: 20px 0; }
</style>

<div class="wrap">
  <header class="top">
    <div class="date" id="dateLine"></div>
    <h1 id="pageTitle">今天吃点什么？</h1>
  </header>

  <section class="view active" id="view-home">
    <p class="sub">不知道吃什么？让今天的饭菜安排得明明白白。</p>

    <div class="hero-card">
      <div class="hero-art">🍚 🥘 🥬</div>
      <div class="hero-title">今天吃什么</div>
      <div class="hero-desc">荤菜、素菜、主食、汤，一次搭配好。</div>
      <button class="hero-btn" id="heroGo">给我安排一顿 →</button>
    </div>

    <div class="quick-entries" id="quickEntries">
      <button class="quick-entry" data-view="light"><span class="qe-emoji">🥗</span><span class="qe-text">减脂餐</span></button>
      <button class="quick-entry" data-view="solo"><span class="qe-emoji">🍜</span><span class="qe-text">一个人吃饭</span></button>
      <button class="quick-entry" id="toFridge"><span class="qe-emoji">🥘</span><span class="qe-text">清冰箱</span></button>
    </div>

    <div class="fridge-block">
      <h2>冰箱里还有啥？</h2>
      <p class="hint">别浪费食材，看看能做出什么好吃的。</p>
      <div class="fridge-box">
        <input type="text" id="fridgeInput" placeholder="比如：西红柿、鸡蛋、青椒、猪肉" autocomplete="off">
        <button id="fridgeGo">看看能做什么</button>
      </div>
      <div id="fridgeResult"></div>
    </div>
  </section>

  <section class="view" id="view-dinner">
    <button class="back-btn" data-back="home">← 返回首页</button>
    <p class="sub">给你俩挑了一桌，点开任意一道看食材和做法；不满意就「换一批」。</p>
    <section class="menu" id="menu"></section>
    <button class="reroll" id="reroll">🔁 换一批</button>
    <section class="shopping" id="shopping">
      <h2>🛒 今晚买菜清单</h2>
      <p class="hint">勾选买好的，剩下的照着买。</p>
      <ul class="shop-list" id="shopList"></ul>
      <p class="progress" id="progress"></p>
    </section>
  </section>

  <section class="view" id="view-solo">
    <button class="back-btn" data-back="home">← 返回首页</button>
    <p class="sub">一个人也要好好吃饭，但没必要太为难自己。</p>
    <div class="solo-entries" id="soloEntries"></div>
    <div class="solo-card" id="soloResult" hidden></div>
  </section>

  <section class="view" id="view-light">
    <button class="back-btn" data-back="home">← 返回首页</button>
    <p class="sub">清淡、均衡的一餐（不标卡路里、不承诺减重效果）。</p>
    <section class="menu" id="lightMenu"></section>
    <button class="reroll" id="lightReroll">🔁 换一桌</button>
  </section>
</div>

    { name: "青椒肉丝", cat: "meat", time: "20分钟", ing: ["猪里脊 200g", "青椒 2个", "蒜 2瓣", "生抽 1勺", "淀粉 1勺", "盐 小半勺"], steps: ["备菜：猪里脊顺着纹理切成细丝，加1勺生抽、1勺淀粉、几滴油抓匀，腌10分钟；青椒去籽切丝，蒜切末。", "热锅倒油（比平时略多），油温五成热（微微冒烟）时下肉丝，用筷子快速划散。", "炒到肉丝全部变白立即盛出，别炒老。", "锅里留底油，下蒜末小火爆香，再下青椒丝转大火炒约1分钟，炒到青椒断生、颜色变亮。", "倒回肉丝，加小半勺盐，大火翻炒30秒让味道融合即可出锅。"] },

    { name: "红烧排骨", cat: "meat", time: "50分钟", ing: ["排骨 500g", "姜 3片", "葱 1段", "冰糖 5粒", "生抽 2勺", "老抽 半勺", "料酒 1勺", "八角 1个"], steps: ["排骨剁成小段，冷水下锅加姜片料酒，煮开后撇去浮沫，捞出用温水冲净沥干。", "锅里放少许油，下冰糖小火慢慢熬，熬到融化变成琥珀色（注意别熬糊，会发苦）。", "下排骨翻炒，让每块都裹上糖色，再加生抽、老抽、八角、葱姜炒匀。", "加开水没过排骨，大火烧开转小火，盖盖焖40分钟。", "开盖转大火收汁，收到汤汁浓稠裹在排骨上即可。"] },
    { name: "可乐鸡翅", cat: "meat", time: "30分钟", ing: ["鸡翅中 8个", "可乐 1罐(330ml)", "姜 3片", "生抽 1勺", "料酒 1勺"], steps: ["鸡翅两面各划两刀方便入味，冷水下锅加料酒焯水，捞出沥干。", "平底锅倒少许油，下鸡翅小火煎到两面金黄。", "倒入可乐（没过鸡翅）、生抽、姜片，大火烧开。", "转中火炖15分钟，再开大火收汁，收到汤汁浓稠、鸡翅裹满酱汁即可。"] },
    { name: "土豆炖牛肉", cat: "meat", time: "70分钟", ing: ["牛腩 400g", "土豆 2个", "胡萝卜 1根", "葱姜 适量", "八角 1个", "生抽 2勺", "料酒 1勺", "盐 适量"], steps: ["牛腩切块，冷水下锅焯水去浮沫，捞出洗净。", "锅里倒油，下葱姜八角爆香，下牛肉翻炒，加生抽、料酒炒匀。", "加开水没过牛肉，大火烧开转小火，炖40分钟。", "土豆、胡萝卜切滚刀块下锅，加盐，再炖20分钟到土豆软烂、汤汁浓稠。"] },

    { name: "糖醋里脊", cat: "meat", time: "30分钟", ing: ["猪里脊 300g", "鸡蛋 1个", "淀粉 适量", "番茄酱 3勺", "糖 2勺", "醋 2勺", "盐 少许"], steps: ["里脊切条，加盐、蛋液抓匀，再裹一层干淀粉。", "锅里倒油烧至六成热（放筷子冒小泡），下里脊条中火炸至金黄捞出，复炸一遍更酥脆。", "另起锅，放番茄酱、糖、醋和2勺水，小火炒到冒泡。", "下炸好的里脊快速翻炒，让每条都裹上糖醋汁，出锅。"] },
    { name: "回锅肉", cat: "meat", time: "30分钟", ing: ["五花肉 300g", "蒜苗 3根", "豆瓣酱 1勺", "豆豉 半勺", "青椒 1个", "姜 2片"], steps: ["五花肉整块冷水下锅煮20分钟，筷子能扎透就捞出，放凉切薄片。", "锅烧热下肉片，小火煸炒，煸到肉片卷曲、出油。", "下豆瓣酱、豆豉、姜片炒出红油。", "下蒜苗段、青椒块，大火翻炒1分钟到蒜苗断生即可。"] },
    { name: "蒜苔炒肉", cat: "meat", time: "15分钟", ing: ["蒜苔 1把", "五花肉 150g", "生抽 1勺", "姜 2片", "盐 少许"], steps: ["五花肉切薄片，蒜苔切段。", "锅烧热下肉片，小火煸出油、肉片微卷。", "下姜片和蒜苔，转中火翻炒2分钟，加生抽、盐。", "再炒1分钟，蒜苔断生但仍脆嫩即可出锅。"] },
    { name: "木须肉", cat: "meat", time: "25分钟", ing: ["猪里脊 150g", "鸡蛋 2个", "木耳 几朵", "黄瓜 半根", "黄花菜 1小把", "生抽 1勺", "盐 少许"], steps: ["里脊切片加生抽、淀粉腌10分钟；木耳泡发撕小朵，黄瓜切片，黄花菜泡发。", "鸡蛋打散炒成块盛出；肉片滑炒变白盛出。", "锅里下木耳、黄花菜、黄瓜翻炒1分钟。", "倒回肉片和鸡蛋，加盐、生抽，翻炒均匀出锅。"] },
    { name: "清蒸鲈鱼", cat: "meat", time: "25分钟", ing: ["鲈鱼 1条(约500g)", "姜 1块", "小葱 3根", "蒸鱼豉油 3勺", "料酒 1勺"], steps: ["鲈鱼处理干净，两面各划两刀，用料酒抹匀，鱼身上和鱼肚里铺姜丝。", "蒸锅水烧开后放鱼，大火蒸8分钟（鱼大的话蒸10分钟）。", "取出倒掉盘里的腥水，去掉姜丝，重新铺上葱丝。", "淋上蒸鱼豉油，烧一勺热油浇在葱丝上激出香味。"] },
    { name: "白灼虾", cat: "meat", time: "12分钟", ing: ["鲜虾 400g", "姜 3片", "小葱 2根", "料酒 1勺", "生抽 2勺"], steps: ["鲜虾剪去虾须、挑去虾线，洗净。", "锅里水烧开，放姜片、葱段、料酒。", "下虾煮2分钟，虾变红弯曲即可捞出（别煮老，肉会柴）。", "调蘸汁：生抽加少许姜末，虾剥壳蘸着吃。"] },
    { name: "红烧肉", cat: "meat", time: "80分钟", ing: ["五花肉 500g", "冰糖 8粒", "生抽 2勺", "老抽 1勺", "姜 3片", "八角 1个", "料酒 1勺"], steps: ["五花肉切麻将大小的块，冷水下锅焯水，捞出洗净。", "锅少油，下冰糖小火熬成琥珀色糖色。", "下五花肉翻炒裹糖色，加生抽、老抽、料酒、姜、八角。", "加开水没过肉，大火烧开转小火，炖60分钟。", "开大火收汁，收到汤汁浓稠红亮即可。"] },
    { name: "辣子鸡丁", cat: "meat", time: "30分钟", ing: ["鸡腿肉 300g", "干辣椒 15个", "花椒 1小把", "葱姜蒜 适量", "生抽 1勺", "盐 少许", "淀粉 适量"], steps: ["鸡腿去骨切丁，加生抽、盐、淀粉腌15分钟。", "锅里油烧至六成热，下鸡丁炸至金黄捞出。", "锅里留底油，下干辣椒段、花椒、葱姜蒜，小火炒香（别炒糊）。", "倒回鸡丁，大火翻炒1分钟，让麻辣味裹匀即可。"] },
    { name: "黄焖鸡", cat: "meat", time: "40分钟", ing: ["鸡腿 3个", "香菇 6朵", "青椒 1个", "姜 3片", "生抽 2勺", "老抽 半勺", "糖 半勺", "料酒 1勺"], steps: ["鸡腿剁块焯水，香菇泡发对半切，青椒切块。", "锅里倒油，下姜片和鸡块炒到表面金黄。", "加生抽、老抽、糖、料酒炒匀，下香菇，加热水没过。", "大火烧开转小火焖20分钟。", "下青椒，转大火收汁到浓稠即可。"] },
    { name: "红烧鸡块", cat: "meat", time: "35分钟", ing: ["鸡腿 3个", "土豆 1个", "姜 3片", "葱 1段", "生抽 2勺", "老抽 半勺", "冰糖 3粒", "料酒 1勺"], steps: ["鸡腿剁块焯水，土豆切滚刀块。", "锅少油下冰糖熬成糖色，下鸡块翻炒裹色。", "加生抽、老抽、料酒、姜葱炒匀，加热水没过。", "大火烧开转小火炖15分钟，下土豆再炖15分钟。", "大火收汁到汤汁浓稠即可。"] },
    { name: "咖喱鸡块", cat: "meat", time: "35分钟", ing: ["鸡腿 3个", "土豆 2个", "胡萝卜 1根", "洋葱 半个", "咖喱块 2块", "盐 少许"], steps: ["鸡腿剁块焯水，土豆、胡萝卜切滚刀块，洋葱切块。", "热油下洋葱炒香，下鸡块炒到变色。", "下土豆、胡萝卜翻炒，加水没过。", "大火烧开转小火炖15分钟。", "下咖喱块搅化，再炖5分钟到汤汁浓稠即可。"] },
    { name: "糖醋排骨", cat: "meat", time: "40分钟", ing: ["排骨 500g", "糖 3勺", "醋 3勺", "生抽 1勺", "料酒 1勺", "姜 3片", "盐 少许"], steps: ["排骨剁段焯水沥干。", "锅里少油，下排骨煎到表面金黄。", "加糖、醋、生抽、料酒、姜片和热水没过。", "大火烧开转小火炖25分钟。", "开大火收汁，收到糖醋汁浓稠裹住排骨即可。"] },
    { name: "椒盐虾", cat: "meat", time: "20分钟", ing: ["鲜虾 400g", "淀粉 2勺", "椒盐 1勺", "蒜 3瓣", "葱花 少许"], steps: ["鲜虾去虾线，裹一层薄薄的干淀粉。", "锅里油烧至六成热，下虾炸到金黄酥脆捞出。", "锅里留底油，下蒜末炒香。", "倒回虾，撒椒盐和葱花，快速翻炒均匀即可。"] },
    { name: "香煎带鱼", cat: "meat", time: "20分钟", ing: ["带鱼 500g", "姜 3片", "料酒 1勺", "盐 少许", "淀粉 适量"], steps: ["带鱼切段，用料酒、姜片、盐腌15分钟，擦干水分。", "带鱼段裹一层薄淀粉。", "平底锅倒油，下带鱼中小火煎。", "煎到两面金黄酥脆即可出锅。"] },
    { name: "芹菜炒牛肉", cat: "meat", time: "20分钟", ing: ["牛肉 200g", "芹菜 1把", "姜 2片", "生抽 1勺", "淀粉 1勺", "盐 少许"], steps: ["牛肉切丝，加生抽、淀粉、几滴油抓匀腌10分钟；芹菜切段。", "热油下牛肉快速滑散，变白盛出。", "锅里下姜片、芹菜大火炒1分钟。", "倒回牛肉，加盐翻炒均匀出锅。"] },
    { name: "洋葱炒牛肉", cat: "meat", time: "20分钟", ing: ["牛肉 200g", "洋葱 1个", "生抽 1勺", "淀粉 1勺", "盐 少许"], steps: ["牛肉切片加生抽、淀粉腌10分钟；洋葱切丝。", "热油下牛肉滑散盛出。", "锅里下洋葱丝炒软、出香味。", "倒回牛肉，加盐翻炒均匀即可。"] },
    { name: "京酱肉丝", cat: "meat", time: "25分钟", ing: ["猪里脊 200g", "豆腐皮 2张", "大葱 1根", "甜面酱 2勺", "糖 半勺", "生抽 1勺", "淀粉 1勺"], steps: ["里脊切丝加生抽、淀粉腌10分钟；豆腐皮切方块蒸热，大葱切丝铺盘。", "热油下肉丝滑散盛出。", "锅里下甜面酱、糖、少许水，小火炒香。", "倒回肉丝翻炒，让酱汁裹匀，盛在葱丝上。", "用豆腐皮卷肉丝和葱丝吃。"] },
    { name: "番茄牛腩", cat: "meat", time: "80分钟", ing: ["牛腩 400g", "番茄 3个", "洋葱 半个", "姜 3片", "生抽 2勺", "盐 适量", "糖 半勺"], steps: ["牛腩切块焯水，番茄切块，洋葱切块。", "热油下洋葱、姜片炒香，下牛腩翻炒。", "下两个番茄炒出汁，加生抽和热水没过，小火炖60分钟。", "下剩下的番茄块，加盐、糖，再炖10分钟即可。"] },
    { name: "孜然羊肉", cat: "meat", time: "20分钟", ing: ["羊肉卷 300g", "洋葱 半个", "孜然粉 1勺", "辣椒粉 少许", "生抽 1勺", "盐 少许"], steps: ["洋葱切丝。", "热油下羊肉卷大火快速翻炒到变色。", "下洋葱丝炒软。", "加孜然粉、辣椒粉、生抽、盐，翻炒均匀即可。"] },
    { name: "蒜蓉蒸虾", cat: "meat", time: "15分钟", ing: ["鲜虾 400g", "蒜 6瓣", "粉丝 1把", "生抽 2勺", "葱花 少许", "油 2勺"], steps: ["粉丝泡软铺盘底，虾开背去虾线摆粉丝上。", "蒜切末，一半用油炒香，和生蒜末、生抽拌匀成蒜蓉酱。", "蒜蓉酱铺在虾上。", "水开蒸6分钟，撒葱花，浇一勺热油即可。"] },
    { name: "红烧鱼", cat: "meat", time: "30分钟", ing: ["草鱼 1条", "姜 4片", "葱 1段", "蒜 3瓣", "生抽 2勺", "老抽 半勺", "糖 1勺", "料酒 1勺", "盐 少许"], steps: ["鱼处理干净，两面划刀，用料酒、盐抹匀腌10分钟。", "锅里倒油，下鱼煎到两面金黄。", "下姜葱蒜爆香，加生抽、老抽、糖和热水。", "大火烧开转中火炖10分钟，中途翻面。", "大火收汁，汤汁浇在鱼上即可。"] },
    { name: "水煮肉片", cat: "meat", time: "30分钟", ing: ["猪里脊 300g", "豆芽 200g", "豆瓣酱 2勺", "干辣椒 10个", "花椒 1小把", "蒜 3瓣", "淀粉 1勺", "生抽 1勺", "盐 少许"], steps: ["里脊切薄片，加生抽、淀粉腌15分钟。", "豆芽焯熟铺在碗底。", "热油下豆瓣酱炒出红油，加两碗水烧开。", "下肉片煮到变白，连汤倒在豆芽上。", "撒干辣椒段、花椒、蒜末，浇一勺热油激香。"] },

    // 素菜
    { name: "蒜蓉西兰花", cat: "veg", time: "12分钟", ing: ["西兰花 1颗", "蒜 4瓣", "蚝油 1勺", "盐 少许"], steps: ["西兰花掰成小朵，用淡盐水泡10分钟，冲洗干净。", "锅里水烧开，加几滴油和少许盐，下西兰花焯1分钟，捞出沥干。", "锅里倒油，下蒜末小火炒香。", "下西兰花，加蚝油、盐，大火翻炒1分钟即可。"] },
    { name: "醋溜白菜", cat: "veg", time: "12分钟", ing: ["大白菜 半颗", "醋 2勺", "糖 1勺", "蒜 2瓣", "干辣椒 2个", "盐 少许"], steps: ["白菜帮和叶分开，帮斜切成片，叶撕成块。", "调碗汁：2勺醋、1勺糖、少许盐搅匀。", "热油爆香蒜片、干辣椒，先下白菜帮大火炒1分钟。", "再下白菜叶炒软，淋入碗汁，翻炒均匀即可。"] },
    { name: "麻婆豆腐", cat: "veg", time: "20分钟", ing: ["嫩豆腐 1块", "肉末 50g", "豆瓣酱 1勺", "花椒 1小把", "蒜 2瓣", "淀粉 适量", "盐 少许"], steps: ["豆腐切2厘米见方的小块，放淡盐水里泡5分钟（去豆腥、不易碎）。", "锅里倒油，下肉末炒散，加豆瓣酱、蒜末炒出红油。", "加一碗水烧开，轻轻下豆腐，小火煮3分钟。", "淀粉加水调匀，分两次勾芡，让汤汁裹住豆腐。", "出锅撒花椒面（或花椒炒香压碎）。"] },
    { name: "家常豆腐", cat: "veg", time: "18分钟", ing: ["老豆腐 1块", "青椒 1个", "木耳 几朵", "豆瓣酱 1勺", "生抽 1勺", "蒜 2瓣"], steps: ["老豆腐切厚片，青椒切块，木耳泡发撕小朵。", "平底锅倒油，下豆腐片中小火煎到两面金黄盛出。", "锅里下豆瓣酱、蒜末炒香，下青椒、木耳翻炒。", "倒回豆腐，加生抽和小半碗水，焖2分钟入味即可。"] },
    { name: "酸辣土豆丝", cat: "veg", time: "12分钟", ing: ["土豆 2个", "醋 2勺", "干辣椒 3个", "花椒 少许", "盐 少许", "蒜 2瓣"], steps: ["土豆切细丝，放清水里泡10分钟去淀粉，多洗两遍沥干。", "热油下花椒、干辣椒、蒜片爆香。", "下土豆丝大火快炒1分钟，沿锅边淋入醋。", "加盐翻炒均匀，土豆丝变透明、口感脆爽即可出锅。"] },
    { name: "清炒藕片", cat: "veg", time: "12分钟", ing: ["莲藕 1节", "蒜 2瓣", "白醋 1勺", "盐 少许", "葱花 少许"], steps: ["莲藕去皮切薄片，放加白醋的水里泡5分钟防黑。", "锅里倒油，下蒜末炒香。", "下藕片大火翻炒2分钟，加盐和白醋。", "炒到藕片断生，撒葱花出锅。"] },
    { name: "凉拌黄瓜", cat: "veg", time: "10分钟", ing: ["黄瓜 2根", "蒜 3瓣", "醋 2勺", "生抽 1勺", "香油 少许", "盐 少许"], steps: ["黄瓜用刀拍裂，再切成段。", "蒜拍碎切末，放到黄瓜上。", "加醋、生抽、盐、香油。", "拌匀腌5分钟入味即可。"] },
    { name: "蒜蓉油麦菜", cat: "veg", time: "10分钟", ing: ["油麦菜 1把", "蒜 4瓣", "蚝油 1勺", "盐 少许"], steps: ["油麦菜洗净切段，蒜切末。", "热油下蒜末炒香。", "下油麦菜大火快炒，炒到叶子变软。", "加蚝油、盐翻匀，马上出锅（别炒久，会出水）。"] },
    { name: "红烧茄子", cat: "veg", time: "25分钟", ing: ["茄子 2根", "蒜 3瓣", "生抽 1勺", "糖 半勺", "盐 少许", "淀粉 少许"], steps: ["茄子切滚刀块，撒盐腌10分钟，挤掉水分。", "锅里油烧热，下茄子炸到变软捞出。", "锅里留底油，下蒜末炒香，加生抽、糖和小半碗水。", "下茄子焖2分钟，淀粉勾芡收汁即可。"] },
    { name: "香菇青菜", cat: "veg", time: "15分钟", ing: ["香菇 6朵", "上海青 4棵", "蒜 2瓣", "蚝油 1勺", "盐 少许"], steps: ["香菇切片，上海青对半切，洗净。", "锅里水烧开，加几滴油，下上海青焯30秒捞出摆盘。", "热油爆香蒜末，下香菇中火炒软。", "加蚝油、盐和少许水煮1分钟，把香菇连汁浇在青菜上。"] },
    { name: "清炒豆芽", cat: "veg", time: "10分钟", ing: ["绿豆芽 300g", "蒜 2瓣", "醋 1勺", "盐 少许", "葱花 少许"], steps: ["豆芽洗净沥干水。", "热油下蒜末爆香。", "下豆芽大火快炒，淋醋加盐。", "炒1分钟豆芽断生，撒葱花出锅。"] },
    { name: "地三鲜", cat: "veg", time: "30分钟", ing: ["土豆 1个", "茄子 1根", "青椒 1个", "蒜 3瓣", "生抽 1勺", "糖 半勺", "淀粉 适量", "盐 少许"], steps: ["土豆、茄子切滚刀块，青椒切块。", "油烧热，分别把土豆、茄子炸至金黄捞出。", "锅里留底油，下蒜末炒香，加生抽、糖、盐和小半碗水。", "下土豆、茄子、青椒，翻炒1分钟，勾芡收汁。"] },
    { name: "干煸豆角", cat: "veg", time: "20分钟", ing: ["豆角 300g", "肉末 50g", "干辣椒 3个", "蒜 3瓣", "盐 少许"], steps: ["豆角去筋掰成段，洗净沥干。", "锅里油烧至五成热，下豆角中火煸炒，炒到表皮起皱盛出。", "锅里下肉末炒散，加干辣椒段、蒜末炒香。", "倒回豆角，加盐翻炒均匀即可。"] },
    { name: "清炒荷兰豆", cat: "veg", time: "10分钟", ing: ["荷兰豆 200g", "蒜 2瓣", "盐 少许"], steps: ["荷兰豆撕去两边老筋，洗净。", "锅里水开加少许盐，下荷兰豆焯30秒捞出。", "热油下蒜末炒香。", "下荷兰豆大火翻炒1分钟，加盐出锅。"] },
    { name: "虎皮青椒", cat: "veg", time: "15分钟", ing: ["青椒 4个", "蒜 3瓣", "生抽 1勺", "醋 1勺", "糖 半勺", "盐 少许"], steps: ["青椒去蒂去籽，用刀拍扁。", "锅烧热不放油，下青椒用铲子压着煎，煎到两面起虎皮。", "把青椒推到一边，倒油下蒜末炒香。", "加生抽、醋、糖、盐和2勺水，翻炒让青椒吸汁即可。"] },
    { name: "蒜蓉菠菜", cat: "veg", time: "10分钟", ing: ["菠菜 1把", "蒜 4瓣", "盐 少许"], steps: ["菠菜洗净切段。", "锅里水开加少许盐，下菠菜焯30秒捞出沥干。", "热油下蒜末炒香。", "下菠菜大火快炒，加盐翻匀出锅。"] },
    { name: "清炒上海青", cat: "veg", time: "10分钟", ing: ["上海青 4棵", "蒜 2瓣", "盐 少许", "蚝油 少许"], steps: ["上海青洗净，对半切。", "热油下蒜末炒香。", "先下菜帮炒1分钟，再下叶子。", "加盐、蚝油炒熟出锅。"] },
    { name: "蒜蓉空心菜", cat: "veg", time: "10分钟", ing: ["空心菜 1把", "蒜 4瓣", "盐 少许"], steps: ["空心菜洗净切段。", "热油下蒜末炒香。", "下空心菜大火快炒，炒到变软。", "加盐翻匀出锅。"] },
    { name: "凉拌木耳", cat: "veg", time: "12分钟", ing: ["木耳 1把", "蒜 3瓣", "醋 2勺", "生抽 1勺", "香油 少许", "香菜 少许"], steps: ["木耳泡发，焯水2分钟捞出过凉水。", "蒜切末，香菜切段。", "木耳加蒜末、醋、生抽、香油、香菜。", "拌匀即可。"] },
    { name: "清炒山药", cat: "veg", time: "12分钟", ing: ["山药 1根", "蒜 2瓣", "盐 少许", "葱花 少许"], steps: ["山药去皮切薄片，放清水里泡着防黑。", "热油下蒜末炒香。", "下山药片大火翻炒2分钟。", "加盐炒匀，撒葱花出锅。"] },
    { name: "番茄炒花菜", cat: "veg", time: "15分钟", ing: ["花菜 半颗", "番茄 2个", "蒜 2瓣", "盐 少许", "糖 半勺"], steps: ["花菜掰小朵焯水1分钟；番茄切块。", "热油下番茄炒出汁。", "下花菜翻炒2分钟。", "加盐、糖炒匀出锅。"] },
    { name: "干煸杏鲍菇", cat: "veg", time: "15分钟", ing: ["杏鲍菇 2根", "蒜 3瓣", "干辣椒 2个", "生抽 1勺", "盐 少许"], steps: ["杏鲍菇撕成条。", "锅烧热下杏鲍菇，中火煸炒到出水再炒干。", "下蒜末、干辣椒炒香。", "加生抽、盐翻炒均匀即可。"] },
    { name: "蒜蓉金针菇", cat: "veg", time: "12分钟", ing: ["金针菇 1把", "蒜 5瓣", "生抽 1勺", "蚝油 半勺", "葱花 少许"], steps: ["金针菇去根洗净，摆盘。", "蒜切末，用油炒香，加生抽、蚝油拌匀成蒜蓉酱。", "蒜蓉酱铺在金针菇上。", "水开蒸6分钟，撒葱花即可。"] },
    { name: "清炒丝瓜", cat: "veg", time: "12分钟", ing: ["丝瓜 2根", "蒜 2瓣", "盐 少许"], steps: ["丝瓜去皮切滚刀块。", "热油下蒜末炒香。", "下丝瓜中火炒到变软、出汁。", "加盐炒匀出锅。"] },
    { name: "苦瓜炒蛋", cat: "veg", time: "15分钟", ing: ["苦瓜 1根", "鸡蛋 3个", "盐 少许"], steps: ["苦瓜去瓤切薄片，加盐腌10分钟挤去苦水。", "鸡蛋打散炒成块盛出。", "下苦瓜翻炒2分钟。", "倒回鸡蛋，加盐炒匀。"] },
    { name: "韭菜炒鸡蛋", cat: "veg", time: "10分钟", ing: ["韭菜 1把", "鸡蛋 3个", "盐 少许"], steps: ["韭菜洗净切段，鸡蛋打散。", "热油炒鸡蛋成块盛出。", "下韭菜大火快炒30秒。", "倒回鸡蛋，加盐翻匀出锅。"] },
    { name: "西葫芦炒鸡蛋", cat: "veg", time: "12分钟", ing: ["西葫芦 1根", "鸡蛋 2个", "蒜 2瓣", "盐 少许"], steps: ["西葫芦切片，鸡蛋打散。", "热油炒鸡蛋盛出。", "下蒜末、西葫芦炒到变软。", "倒回鸡蛋，加盐炒匀。"] },
    { name: "芹菜炒香干", cat: "veg", time: "12分钟", ing: ["芹菜 1把", "香干 2块", "蒜 2瓣", "生抽 半勺", "盐 少许"], steps: ["芹菜切段，香干切条。", "热油下蒜末炒香。", "下香干翻炒1分钟，再下芹菜炒2分钟。", "加生抽、盐炒匀出锅。"] },
    { name: "红烧冬瓜", cat: "veg", time: "15分钟", ing: ["冬瓜 400g", "蒜 2瓣", "生抽 1勺", "老抽 少许", "糖 半勺", "盐 少许"], steps: ["冬瓜去皮切块。", "热油下蒜末炒香，下冬瓜翻炒。", "加生抽、老抽、糖和半碗水。", "盖盖焖5分钟到冬瓜软烂，大火收汁即可。"] },

    // 清淡/汤
    { name: "冬瓜虾仁汤", cat: "soup", time: "20分钟", ing: ["冬瓜 300g", "虾仁 150g", "姜 2片", "盐 少许", "葱花 少许"], steps: ["冬瓜去皮切薄片，虾仁挑去虾线。", "锅里水烧开，下姜片和冬瓜，煮5分钟到冬瓜半透明。", "下虾仁再煮2分钟，虾仁变红。", "加盐调味，撒葱花出锅。"] },
    { name: "紫菜蛋花汤", cat: "soup", time: "10分钟", ing: ["紫菜 1小把", "鸡蛋 2个", "虾皮 1小把", "葱 1根", "盐 少许", "香油 几滴"], steps: ["紫菜撕小块，鸡蛋打散，葱切葱花。", "锅里水烧开，下紫菜和虾皮煮1分钟。", "转小火，把蛋液呈细流淋入锅中，停几秒再轻轻搅出蛋花。", "加盐、香油，撒葱花出锅。"] },
    { name: "番茄蛋花汤", cat: "soup", time: "12分钟", ing: ["番茄 2个", "鸡蛋 2个", "葱 1根", "盐 少许"], steps: ["番茄切块，鸡蛋打散，葱切葱花。", "热油下番茄炒出红汁。", "加两碗水烧开，煮2分钟。", "淋入蛋液成蛋花，加盐撒葱花。"] },
    { name: "青菜豆腐汤", cat: "soup", time: "12分钟", ing: ["小青菜 1把", "嫩豆腐 1块", "盐 少许", "香油 几滴"], steps: ["小青菜洗净切段，豆腐切小块。", "锅里水烧开，下豆腐煮3分钟。", "下青菜烫30秒到变软。", "加盐、香油出锅。"] },
    { name: "萝卜排骨汤", cat: "soup", time: "60分钟", ing: ["白萝卜 1根", "排骨 400g", "姜 3片", "盐 适量"], steps: ["排骨冷水下锅焯水，撇浮沫后捞出。", "排骨和姜片放锅里，加足量开水，大火烧开转小火炖30分钟。", "白萝卜切滚刀块下锅，再炖20分钟。", "加盐调味，萝卜软烂即可。"] },
    { name: "玉米排骨汤", cat: "soup", time: "60分钟", ing: ["甜玉米 2根", "排骨 400g", "姜 3片", "盐 适量"], steps: ["排骨焯水捞出，玉米切段。", "排骨、玉米、姜片一起下锅，加足量开水。", "大火烧开转小火炖45分钟。", "加盐调味即可。"] },
    { name: "酸辣汤", cat: "soup", time: "18分钟", ing: ["豆腐 半块", "木耳 几朵", "鸡蛋 1个", "醋 3勺", "白胡椒粉 1小勺", "淀粉 适量", "盐 少许", "香菜 少许"], steps: ["豆腐、木耳切细丝。", "锅里水烧开，下豆腐丝、木耳丝煮2分钟。", "加醋、白胡椒粉、盐调味。", "淀粉加水调匀淋入勾芡，再淋蛋液成蛋花。", "撒香菜出锅。"] },
    { name: "冬瓜排骨汤", cat: "soup", time: "55分钟", ing: ["冬瓜 300g", "排骨 400g", "姜 3片", "盐 适量"], steps: ["排骨焯水去浮沫捞出。", "排骨加姜片和开水，大火烧开转小火炖30分钟。", "冬瓜切块下锅，再炖15分钟。", "加盐调味即可。"] },
    { name: "丝瓜蛋汤", cat: "soup", time: "12分钟", ing: ["丝瓜 1根", "鸡蛋 2个", "盐 少许", "香油 几滴"], steps: ["丝瓜去皮切滚刀块，鸡蛋打散。", "热油下丝瓜炒1分钟到变软。", "加两碗水烧开煮2分钟。", "淋蛋液成蛋花，加盐、香油出锅。"] },
    { name: "海带豆腐汤", cat: "soup", time: "18分钟", ing: ["海带 1把", "嫩豆腐 1块", "盐 少许", "葱花 少许"], steps: ["海带泡发洗净切段，豆腐切块。", "锅里水烧开，下海带煮10分钟。", "下豆腐再煮3分钟。", "加盐撒葱花出锅。"] },
    { name: "冬瓜丸子汤", cat: "soup", time: "25分钟", ing: ["冬瓜 300g", "肉馅 200g", "姜 3片", "葱 1根", "盐 适量", "香油 几滴"], steps: ["肉馅加葱花、盐、少许水搅打上劲。", "锅里水烧开，下姜片、冬瓜片煮5分钟。", "肉馅挤成丸子下锅，煮到丸子浮起。", "加盐、香油调味出锅。"] },
    { name: "番茄豆腐汤", cat: "soup", time: "12分钟", ing: ["番茄 2个", "嫩豆腐 1块", "鸡蛋 1个", "盐 少许", "葱花 少许"], steps: ["番茄切块，豆腐切块，鸡蛋打散。", "热油下番茄炒出汁。", "加水烧开，下豆腐煮3分钟。", "淋蛋液成蛋花，加盐撒葱花。"] },
    { name: "菠菜鸡蛋汤", cat: "soup", time: "10分钟", ing: ["菠菜 1把", "鸡蛋 2个", "盐 少许", "香油 几滴"], steps: ["菠菜洗净切段，鸡蛋打散。", "锅里水烧开，下菠菜。", "淋入蛋液成蛋花。", "加盐、香油出锅。"] },
    { name: "莲藕排骨汤", cat: "soup", time: "70分钟", ing: ["莲藕 1节", "排骨 400g", "姜 3片", "盐 适量"], steps: ["排骨焯水捞出，莲藕切块。", "排骨、莲藕、姜片下锅，加足量开水。", "大火烧开转小火炖60分钟。", "加盐调味即可。"] },
    { name: "山药排骨汤", cat: "soup", time: "60分钟", ing: ["山药 1根", "排骨 400g", "姜 3片", "盐 适量"], steps: ["排骨焯水捞出，山药去皮切段。", "排骨、姜片下锅，加开水炖40分钟。", "下山药再炖15分钟。", "加盐调味即可。"] },
    { name: "香菇鸡汤", cat: "soup", time: "70分钟", ing: ["鸡 半只", "香菇 8朵", "姜 3片", "盐 适量"], steps: ["鸡剁块焯水，香菇泡发。", "鸡块、香菇、姜片下锅，加足量开水。", "大火烧开转小火炖60分钟。", "加盐调味即可。"] },
    { name: "白菜豆腐汤", cat: "soup", time: "12分钟", ing: ["大白菜 几片", "嫩豆腐 1块", "盐 少许", "香油 几滴"], steps: ["白菜切段，豆腐切块。", "锅里水烧开，下白菜煮2分钟。", "下豆腐再煮3分钟。", "加盐、香油出锅。"] },
    { name: "平菇肉片汤", cat: "soup", time: "20分钟", ing: ["平菇 1把", "猪里脊 100g", "姜 2片", "淀粉 少许", "盐 适量", "葱花 少许"], steps: ["平菇撕小朵，里脊切片加淀粉抓匀。", "锅里水烧开，下姜片、平菇煮3分钟。", "下肉片煮到变白。", "加盐调味，撒葱花出锅。"] },
    { name: "菌菇汤", cat: "soup", time: "20分钟", ing: ["香菇 4朵", "金针菇 1把", "杏鲍菇 1根", "姜 2片", "盐 适量", "葱花 少许"], steps: ["各种菇洗净切片或撕小朵。", "锅里水烧开，下姜片和所有菇。", "煮10分钟出鲜味。", "加盐调味，撒葱花出锅。"] },
    { name: "虾皮冬瓜汤", cat: "soup", time: "12分钟", ing: ["冬瓜 300g", "虾皮 1小把", "姜 2片", "盐 少许", "葱花 少许"], steps: ["冬瓜去皮切薄片。", "锅里水烧开，下姜片、冬瓜煮5分钟。", "下虾皮再煮1分钟。", "加盐撒葱花出锅。"] },

    // 主食
    { name: "米饭", cat: "staple", time: "35分钟", ing: ["大米 2杯"], steps: ["大米淘洗2遍（别搓太久，会流失营养）。", "加水，水面比米高约一个指节。", "电饭煲按煮饭键。", "跳闸后焖5分钟再开盖，饭更松软。"] },
    { name: "馒头", cat: "staple", time: "15分钟", ing: ["馒头 4个"], steps: ["馒头摆入蒸屉，留点间距。", "锅里水烧开，放蒸屉。", "大火蒸10分钟。", "关火焖2分钟再开盖，馒头不塌。"] },
    { name: "青菜鸡蛋面", cat: "staple", time: "15分钟", ing: ["面条 2把", "小青菜 2棵", "鸡蛋 2个", "生抽 1勺", "盐 少许"], steps: ["平底锅煎两个荷包蛋盛出。", "锅里水烧开，下面条煮到八分熟。", "下青菜烫软，加生抽、盐调味。", "面条连汤盛碗，放上荷包蛋。"] },
    { name: "葱油拌面", cat: "staple", time: "20分钟", ing: ["面条 2把", "小葱 1把", "生抽 3勺", "老抽 1勺", "糖 1勺", "食用油 4勺"], steps: ["小葱切段（葱白、葱绿分开）。", "锅里倒油，下葱段小火慢慢熬，熬到葱变焦黄，捞出葱。", "葱油里加生抽、老抽、糖，小火煮开成葱油汁。", "面条煮熟捞出，浇上葱油汁拌匀，放上炸葱。"] },
    { name: "饺子", cat: "staple", time: "20分钟", ing: ["速冻饺子 40个"], steps: ["锅里水烧开，下饺子用勺子推一下防粘底。", "水开后点一碗凉水，如此三次。", "饺子浮起、皮鼓起来就熟了，捞出。", "调醋蒜汁蘸着吃。"] },
    { name: "包子", cat: "staple", time: "20分钟", ing: ["速冻包子 6个"], steps: ["包子摆入蒸屉，留间距。", "锅里水烧开，放蒸屉。", "大火蒸15分钟。", "关火焖3分钟再开盖。"] },
    { name: "烙饼", cat: "staple", time: "30分钟", ing: ["面粉 300g", "温水 180ml", "食用油 2勺", "盐 少许"], steps: ["面粉加温水揉成软面团，盖布醒20分钟。", "面团擀成薄片，刷油撒盐，卷起再盘成团，擀成圆饼。", "平底锅刷油，放饼中小火烙。", "烙到两面金黄、鼓起即可。"] },
    { name: "小米粥", cat: "staple", time: "35分钟", ing: ["小米 1杯"], steps: ["小米淘洗一遍。", "锅里加水烧开，下小米。", "转小火熬20分钟，不时搅一下防粘底。", "熬到米开花、粥浓稠即可。"] },
    { name: "蛋炒饭", cat: "staple", time: "12分钟", ing: ["米饭 2碗(隔夜最好)", "鸡蛋 2个", "葱 1根", "生抽 半勺", "盐 少许"], steps: ["鸡蛋打散，葱切葱花，隔夜饭提前打散。", "热油下蛋液炒成块盛出。", "锅里再倒油，下米饭中火炒散。", "倒回鸡蛋，加生抽、盐，撒葱花炒匀。"] },
    { name: "蒸红薯玉米", cat: "staple", time: "30分钟", ing: ["红薯 2个", "玉米 2根"], steps: ["红薯、玉米洗净，玉米切段。", "摆入蒸屉，锅里水烧开。", "大火蒸20分钟。", "用筷子能轻松扎透就熟了。"] },
    { name: "白粥", cat: "staple", time: "40分钟", ing: ["大米 1杯"], steps: ["大米淘洗干净。", "锅里加10倍水烧开，下大米。", "转小火熬30分钟，不时搅动防粘底。", "熬到米开花、粥稀稠合适即可。"] },
    { name: "皮蛋瘦肉粥", cat: "staple", time: "40分钟", ing: ["大米 1杯", "皮蛋 2个", "瘦肉 100g", "姜 2片", "盐 少许", "葱花 少许"], steps: ["大米加水熬成白粥。", "瘦肉切丝焯水，皮蛋切丁。", "粥熬好后下肉丝、皮蛋、姜丝煮5分钟。", "加盐调味，撒葱花出锅。"] },
    { name: "番茄鸡蛋面", cat: "staple", time: "15分钟", ing: ["面条 2把", "番茄 2个", "鸡蛋 2个", "葱 1根", "盐 少许"], steps: ["番茄切块，鸡蛋打散。", "热油炒鸡蛋盛出，下番茄炒出汁。", "加两碗水烧开，下面条煮到八分熟。", "倒回鸡蛋，加盐，撒葱花出锅。"] },
    { name: "葱花饼", cat: "staple", time: "25分钟", ing: ["面粉 250g", "温水 150ml", "小葱 3根", "油 2勺", "盐 少许"], steps: ["面粉加温水和成软面团，醒15分钟。", "小葱切葱花。", "面团擀薄，刷油撒盐和葱花，卷起再擀成饼。", "平底锅刷油，中小火烙到两面金黄。"] },
    { name: "手抓饼", cat: "staple", time: "10分钟", ing: ["手抓饼饼坯 2张", "鸡蛋 2个", "生菜 2片"], steps: ["平底锅不放油，下饼坯中小火煎。", "煎到一面金黄翻面，打个鸡蛋在饼上摊开。", "鸡蛋凝固后翻面，放生菜。", "两面金黄卷起即可。"] },
    { name: "蒸紫薯", cat: "staple", time: "25分钟", ing: ["紫薯 3个"], steps: ["紫薯洗净（不用去皮）。", "摆入蒸屉，锅里水烧开。", "大火蒸20分钟。", "用筷子能轻松扎透就熟了。"] }
  ];

  const CATS = [
    { key: "soup", label: "🥬 清淡汤", color: "var(--soup)" },
    { key: "meat", label: "🥩 荤菜", color: "var(--meat)" },
    { key: "veg", label: "🥗 素菜", color: "var(--veg)" },
    { key: "staple", label: "🍚 主食", color: "var(--staple)" }
  ];

  // —— 工具 ——
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function todayStr() { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }

  const store = {
    get(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } },
    set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
  };

  // 最近 7 天吃过的菜名（用于换样）
  function loadRecent() {
    const rec = store.get("recent", []);
    const today = todayStr();
    return rec.filter(x => x.date === today || (Date.now() - new Date(x.date).getTime()) < 7 * 86400000)
              .map(x => x.name);
  }

  function pick(cat, rnd, avoid) {
    const pool = RECIPES.filter(r => r.cat === cat);
    let cand = pool.filter(r => avoid.indexOf(r.name) === -1);
    if (cand.length === 0) cand = pool;
    return cand[Math.floor(rnd() * cand.length)];
  }

  // 生成菜单
  function buildMenu() {
    const saved = store.get("menu_" + todayStr(), null);
    if (saved) return saved;

    const avoid = loadRecent();
    const seed = hashStr(todayStr());
    const rnd = mulberry32(seed);
    const menu = {};
    CATS.forEach(c => { menu[c.key] = pick(c.key, rnd, avoid); });

    store.set("menu_" + todayStr(), menu);
    // 记录今天吃过的
    const rec = store.get("recent", []);
    CATS.forEach(c => rec.push({ date: todayStr(), name: menu[c.key].name }));
    store.set("recent", rec);
    return menu;
  }

  function reroll() {
    const avoid = loadRecent();
    const rnd = mulberry32(Date.now() & 0xffffffff);
    const menu = {};
    CATS.forEach(c => { menu[c.key] = pick(c.key, rnd, avoid); });
    store.set("menu_" + todayStr(), menu);
    render(menu);
  }

  // 汇总食材（去重，保持顺序）
  function collectIngredients(menu) {
    const seen = new Set();
    const list = [];
    CATS.forEach(c => {
      (menu[c.key].ing || []).forEach(it => {
        if (!seen.has(it)) { seen.add(it); list.push(it); }
      });
    });
    return list;
  }

  // —— 渲染 ——
  const menuEl = document.getElementById("menu");
  const shopListEl = document.getElementById("shopList");
  const progressEl = document.getElementById("progress");

  function renderMenu(menu, container) {
    container.innerHTML = "";
    CATS.forEach(c => {
      const dish = menu[c.key];
      if (!dish) return;
      const art = document.createElement("article");
      art.className = "card cat-" + c.key;

      const head = document.createElement("button");
      head.className = "card-head";
      head.innerHTML =
        '<span class="badge">' + c.label + "</span>" +
        '<span class="dish-name">' + dish.name + "</span>" +
        '<span class="chev">▾</span>';

      const body = document.createElement("div");
      body.className = "card-body";
      body.hidden = true;
      body.innerHTML =
        '<section><p class="sec-label">🛒 食材</p><ul class="ing-list">' +
        dish.ing.map(i => "<li>" + i + "</li>").join("") +
        "</ul></section>" +
        '<section><p class="sec-label">🍳 做法（约' + dish.time + "）</p><ol class=\"steps\">" +
        dish.steps.map(s => "<li>" + s + "</li>").join("") +
        "</ol></section>";

      head.addEventListener("click", () => {
        const open = art.classList.toggle("open");
        body.hidden = !open;
      });

      art.appendChild(head);
      art.appendChild(body);
      container.appendChild(art);
    });
  }

  function render(menu) {
    const d = new Date();
    const week = "日一二三四五六"[d.getDay()];
    document.getElementById("dateLine").textContent =
      (d.getMonth() + 1) + "月" + d.getDate() + "日 · 周" + week;

    renderMenu(menu, menuEl);

    // 买菜清单
    const ings = collectIngredients(menu);
    const checked = store.get("checked", {});
    shopListEl.innerHTML = "";
    ings.forEach(it => {
      const li = document.createElement("li");
      const input = document.createElement("input");
      input.type = "checkbox";
      input.id = "chk_" + it.replace(/[^一-龥a-zA-Z0-9]/g, "");
      input.checked = !!checked[it];
      input.addEventListener("change", () => {
        checked[it] = input.checked;
        store.set("checked", checked);
        updateProgress();
      });
      const label = document.createElement("label");
      label.htmlFor = input.id;
      label.textContent = it;
      li.appendChild(input);
      li.appendChild(label);
      shopListEl.appendChild(li);
    });
    updateProgress();
  }

  function updateProgress() {
    const total = shopListEl.children.length;
    const done = Array.from(shopListEl.querySelectorAll("input")).filter(i => i.checked).length;
    progressEl.textContent = "已买 " + done + " / " + total + " 样";
  }

  document.getElementById("reroll").addEventListener("click", reroll);

  render(buildMenu());

  // ===== 一人餐 =====
  const SOLO = {
    lazy: {
      emoji: "🍜", title: "懒人随便吃", desc: "简单、方便、少洗锅",
      taglines: ["今天不想折腾？少洗一个锅也是胜利。", "能用一个锅，绝不用两个。", "糊弄一顿，不丢人。"],
      ideas: [
        { name: "煮个面", desc: "清水煮面 + 煎个荷包蛋 + 烫两根青菜，淋点生抽香油，10分钟。" },
        { name: "蛋炒饭", desc: "隔夜饭 + 俩鸡蛋 + 葱花，5分钟炒好。" },
        { name: "蒸个蛋", desc: "两个蛋打散 + 温水，上锅蒸8分钟，淋生抽。" },
        { name: "煮饺子", desc: "速冻饺子下锅点三次水，配醋蒜。" },
        { name: "拌个凉面", desc: "挂面煮熟过凉水，加黄瓜丝 + 芝麻酱 + 醋一拌。" },
        { name: "煎馒头片", desc: "馒头切片裹蛋液，煎到金黄，配点咸菜。" },
        { name: "泡面加蛋", desc: "泡面煮开加个蛋 + 火腿肠 + 两片青菜，3分钟。" },
        { name: "煮汤圆", desc: "速冻汤圆下锅煮到浮起，当一顿。" }
      ]
    },
    nice: {
      emoji: "🥘", title: "今天吃点好的", desc: "给自己加个餐，稍微认真点",
      taglines: ["一个人也别亏待自己的胃。", "犒劳自己，今天加个鸡腿。", "一个人也要有仪式感。"],
      ideas: [
        { name: "番茄牛腩饭", desc: "番茄牛腩炖一锅，浇在米饭上，能管两顿。" },
        { name: "黄焖鸡米饭", desc: "黄焖鸡炖一锅配米饭，像外面卖的那样。" },
        { name: "可乐鸡翅", desc: "鸡翅煎一煎加可乐焖，甜口解馋。" },
        { name: "清蒸鲈鱼", desc: "蒸一条鲈鱼淋豉油，鲜掉眉毛。" },
        { name: "红烧排骨", desc: "排骨炖一锅，糖色红亮，啃着过瘾。" },
        { name: "蒜蓉蒸虾", desc: "虾开背铺蒜蓉蒸6分钟，鲜香。" },
        { name: "番茄炒蛋盖饭", desc: "番茄炒蛋多炒点汁，浇饭上，经典下饭。" },
        { name: "煎牛排", desc: "牛排煎到七分熟，配点西兰花，一个人的西餐。" }
      ]
    },
    noCook: {
      emoji: "🛒", title: "不想做饭了", desc: "今天就吃点简单的，放过自己",
      taglines: ["今天放过自己，出去吃点好的。", "懒不是罪，是今天的合法状态。", "下厨的事，明天再说。"],
      ideas: [
        { name: "楼下便利店", desc: "饭团 + 牛奶 + 香蕉，10块钱解决。" },
        { name: "楼下面馆", desc: "一碗牛肉面加个卤蛋，热乎。" },
        { name: "点个外卖", desc: "黄焖鸡米饭或盖浇饭，送到家。" },
        { name: "炒饭摊", desc: "一份蛋炒饭 + 一瓶冰饮，省事。" },
        { name: "包子铺", desc: "两个肉包 + 一碗豆浆，管饱。" },
        { name: "麻辣烫", desc: "外卖点份麻辣烫，想加啥加啥。" },
        { name: "面包店", desc: "一个三明治 + 一杯酸奶，凑合一顿。" },
        { name: "楼下烧烤", desc: "几串烤肉，一个人的快乐。" }
      ]
    }
  };

  const soloEntriesEl = document.getElementById("soloEntries");
  const soloResultEl = document.getElementById("soloResult");
  let soloKey = null;

  function renderSoloEntries() {
    soloEntriesEl.innerHTML = "";
    Object.keys(SOLO).forEach(function (key) {
      const s = SOLO[key];
      const div = document.createElement("div");
      div.className = "solo-entry";
      div.innerHTML =
        '<div class="solo-emoji">' + s.emoji + "</div>" +
        '<div class="solo-title">' + s.title + "</div>" +
        '<div class="solo-desc">' + s.desc + "</div>";
      div.addEventListener("click", function () { showSolo(key); });
      soloEntriesEl.appendChild(div);
    });
  }

  function showSolo(key) {
    soloKey = key;
    const s = SOLO[key];
    const tagline = s.taglines[Math.floor(Math.random() * s.taglines.length)];
    const idea = s.ideas[Math.floor(Math.random() * s.ideas.length)];
    soloResultEl.hidden = false;
    soloResultEl.innerHTML =
      '<p class="tagline">' + tagline + "</p>" +
      '<p class="idea">' + idea.name + "</p>" +
      '<p class="idea-desc">' + idea.desc + "</p>" +
      '<button class="again" id="soloAgain">换个主意</button>';
    document.getElementById("soloAgain").addEventListener("click", function () { showSolo(soloKey); });
    soloResultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  renderSoloEntries();

  // ===== 清冰箱 =====
  const SKIP_ING = ["生抽", "老抽", "盐", "糖", "白糖", "冰糖", "醋", "白醋", "淀粉", "料酒", "油", "食用油", "姜", "蒜", "葱", "小葱", "葱花", "姜片", "蒜末", "八角", "花椒", "干辣椒", "豆瓣酱", "白胡椒粉", "白胡椒", "香油", "蚝油", "甜面酱", "咖喱块", "椒盐", "孜然粉", "辣椒粉", "番茄酱", "蒸鱼豉油", "豆豉", "虾皮", "香菜", "温水", "开水", "热水"];

  function coreOf(ing) {
    return ing.map(function (item) {
      return item.split(" ")[0].trim();
    }).filter(function (name) { return name && SKIP_ING.indexOf(name) === -1; });
  }

  function matchFridge(inputs) {
    const results = [];
    RECIPES.forEach(function (r) {
      const core = coreOf(r.ing);
      if (core.length === 0) return;
      const have = core.filter(function (c) {
        return inputs.some(function (u) { return c.indexOf(u) !== -1 || u.indexOf(c) !== -1; });
      });
      if (have.length === 0) return;
      const lack = core.filter(function (c) { return have.indexOf(c) === -1; });
      results.push({ recipe: r, have: have, lack: lack, score: have.length / core.length });
    });
    results.sort(function (a, b) { return b.score - a.score; });
    return results;
  }

  const fridgeInput = document.getElementById("fridgeInput");
  const fridgeGo = document.getElementById("fridgeGo");
  const fridgeResult = document.getElementById("fridgeResult");

  function renderFridge() {
    const raw = fridgeInput.value;
    if (!raw.trim()) { fridgeResult.innerHTML = '<div class="fridge-empty">先输入冰箱里的食材哦～</div>'; return; }
    const inputs = raw.split(/[,，、\s]+/).filter(Boolean).map(function (s) { return s.trim(); });
    const matches = matchFridge(inputs);
    if (matches.length === 0) {
      fridgeResult.innerHTML = '<div class="fridge-empty">没找到特别匹配的菜，试试输入更常见的食材（比如 鸡蛋、番茄、青椒、猪肉、土豆）。</div>';
      return;
    }
    let html = "";
    matches.slice(0, 8).forEach(function (m) {
      const pct = Math.round(m.score * 100);
      html +=
        '<div class="match-card"><div class="match-top"><span class="match-name">' + m.recipe.name + '</span><span class="match-pct">' + pct + '% 能成</span></div>' +
        '<div class="match-lines"><span class="have">✅ 已有：' + (m.have.length ? m.have.join("、") : "—") + "</span><br>" +
        '<span class="lack">❌ 还缺：' + (m.lack.length ? m.lack.join("、") : "没有，齐了") + "</span></div></div>";
    });
    fridgeResult.innerHTML = html;
  }

  fridgeGo.addEventListener("click", renderFridge);
  fridgeInput.addEventListener("keydown", function (e) { if (e.key === "Enter") renderFridge(); });

  // ===== 减脂餐 =====
  const lightMenuEl = document.getElementById("lightMenu");

  function isLight(r) {
    if (r.cat === "soup") return true;
    const n = r.name;
    if (/红烧|糖醋|回锅|干煸|辣子|水煮|油炸|咖喱|焖|炸/.test(n)) return false;
    if (/清蒸|白灼|清炒|凉拌|蒜蓉|汤|蒸|煮|焯/.test(n)) return true;
    return r.cat === "veg";
  }

  function buildLightMenu() {
    const lightPool = RECIPES.filter(isLight);
    const soupPool = lightPool.filter(function (r) { return r.cat === "soup"; });
    const vegPool = lightPool.filter(function (r) { return r.cat === "veg"; });
    const meatPool = lightPool.filter(function (r) { return r.cat === "meat"; });
    const staplePool = RECIPES.filter(function (r) { return r.cat === "staple"; });
    const rnd = mulberry32(hashStr(todayStr()) ^ 0x9e3779b9);
    function pickOne(pool) { return pool[Math.floor(rnd() * pool.length)]; }
    return {
      soup: pickOne(soupPool.length ? soupPool : lightPool),
      meat: pickOne(meatPool.length ? meatPool : vegPool),
      veg: pickOne(vegPool),
      staple: pickOne(staplePool)
    };
  }

  renderMenu(buildLightMenu(), lightMenuEl);
  document.getElementById("lightReroll").addEventListener("click", function () {
    renderMenu(buildLightMenu(), lightMenuEl);
  });

  // ===== 入口切换（首页 + 功能视图）=====
  const VIEW_TITLES = { home: "今天吃点什么？", dinner: "今晚吃什么", solo: "一个人吃饭", light: "减脂餐" };
  const pageTitle = document.getElementById("pageTitle");

  function switchView(name) {
    document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("active"); });
    document.getElementById("view-" + name).classList.add("active");
    pageTitle.textContent = VIEW_TITLES[name] || "今天吃点什么？";
    window.scrollTo({ top: 0 });
  }

  document.getElementById("heroGo").addEventListener("click", function () { switchView("dinner"); });
  document.querySelectorAll(".quick-entry").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.dataset.view) switchView(btn.dataset.view);
    });
  });
  document.getElementById("toFridge").addEventListener("click", function () {
    const fi = document.getElementById("fridgeInput");
    fi.scrollIntoView({ behavior: "smooth", block: "center" });
    fi.focus();
  });
  document.querySelectorAll(".back-btn").forEach(function (btn) {
    btn.addEventListener("click", function () { switchView(btn.dataset.back); });
  });
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
